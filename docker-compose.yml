services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: promo-bot-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./storage:/var/www/storage
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=promo_bot
      - DB_USERNAME=promo
      - DB_PASSWORD=secret
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "php artisan migrate --force &&
             php artisan db:seed --force &&
             php artisan serve --host=0.0.0.0 --port=8000"

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: promo-bot-worker
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=promo_bot
      - DB_USERNAME=promo
      - DB_PASSWORD=secret
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    command: php artisan telegram:poll

  db:
    image: postgres:16-alpine
    container_name: promo-bot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: promo_bot
      POSTGRES_USER: promo
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promo -d promo_bot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
